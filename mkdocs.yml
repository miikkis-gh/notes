site_name: Muistiinpanot
site_url: https://i.miikkis.fi/
site_description: Muistiinpanoja jaettavaksi
copyright: Sisältö &copy; miikkis — CC BY-SA 4.0

theme:
  name: material
  language: fi
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
  font: false
  palette:
    # Etch: Dark (silver on black) is the default, Light (aluminium) the alternative
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Vaalea tila
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Tumma tila

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js


extra_css:
  - stylesheets/etch.css
