site_name: Muistiinpanot
site_url: https://i.miikkis.fi/
site_description: Opiskelun käsikirja
copyright: Sisältö &copy; miikkis — CC BY-SA 4.0

theme:
  name: material
  language: fi
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Tumma tila
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Vaalea tila

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

nav:
  - Etusivu: index.md
  - Kurssit:
      - courses/index.md
  - Sanasto: glossary.md
